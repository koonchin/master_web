<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#21373C">
  <title>Login — Muslin Pajamas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #21373C;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .login-logo img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
    }
    .login-logo-text {
      display: flex;
      flex-direction: column;
    }
    .login-logo-brand {
      font-size: 15px;
      font-weight: 700;
      color: #21373C;
      line-height: 1.2;
    }
    .login-logo-sys {
      font-size: 12px;
      color: #6b7280;
      font-weight: 500;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #21373C;
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: #21373C;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 16px;
    }
    input:focus { border-color: #21373C; }
    button[type="submit"] {
      width: 100%;
      padding: 11px;
      background: #21373C;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s;
    }
    button[type="submit"]:hover { background: #2e4f56; }
    button[type="submit"]:disabled { background: #9ca3af; cursor: not-allowed; }
    .error-msg {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 14px;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <img src="img/logo.jpg" alt="MUSLIN Logo">
    <div class="login-logo-text">
      <div class="login-logo-brand">MUSLIN PAJAMAS</div>
      <div class="login-logo-sys">PO Tracking System</div>
    </div>
  </div>

  <h1>เข้าสู่ระบบ</h1>
  <p class="login-sub">กรุณาใส่ชื่อผู้ใช้และรหัสผ่าน</p>

  <form id="login-form" onsubmit="handleLogin(event)">
    <label for="username">ชื่อผู้ใช้</label>
    <input type="text" id="username" name="username" autocomplete="username" placeholder="username" required>

    <label for="password">รหัสผ่าน</label>
    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>

    <button type="submit" id="submit-btn">เข้าสู่ระบบ</button>
    <div class="error-msg" id="error-msg"></div>
  </form>
</div>

<script>
  // If already logged in, go straight to index
  if (localStorage.getItem('auth_token')) {
    window.location.replace('index.html');
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('error-msg');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'กำลังเข้าสู่ระบบ...';
    errEl.classList.remove('visible');

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        errEl.textContent = data.error || 'เข้าสู่ระบบไม่สำเร็จ';
        errEl.classList.add('visible');
        return;
      }

      localStorage.setItem('auth_token', data.token);
      localStorage.setItem('auth_role', data.role);
      localStorage.setItem('auth_username', data.username);
      if (data.factory_id !== null && data.factory_id !== undefined) {
        localStorage.setItem('auth_factory_id', data.factory_id);
      }
      window.location.replace('index.html');
    } catch (err) {
      errEl.textContent = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
      errEl.classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ';
    }
  }
</script>
</body>
</html>
